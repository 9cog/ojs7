name: Build & Test

on:
  push:
    branches: [ main, develop, 'feature/*', 'copilot/*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # PHP: lint and structure validation for OJS core
  # ---------------------------------------------------------------------------
  php-lint:
    name: PHP Lint (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.1', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: none
          coverage: none

      - name: Lint PHP entry points and core directories
        run: |
          set -euo pipefail
          echo "Linting PHP files (syntax-only) with PHP ${{ matrix.php-version }}"
          # Limit scope to OJS-owned source (skip vendored libs and lib/pkp which
          # has its own toolchain) so this stays fast and deterministic.
          TARGETS=(index.php api classes controllers pages schemas tools)
          EXIT=0
          for t in "${TARGETS[@]}"; do
            if [ -e "$t" ]; then
              echo "::group::php -l $t"
              if [ -f "$t" ]; then
                php -l "$t" || EXIT=1
              else
                while IFS= read -r -d '' f; do
                  out=$(php -l "$f" 2>&1) || { echo "$out"; EXIT=1; }
                done < <(find "$t" -type f -name '*.php' -print0)
              fi
              echo "::endgroup::"
            fi
          done
          exit $EXIT

  php-structure:
    name: PHP Repo Structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify required OJS files
        run: |
          set -euo pipefail
          required=(
            index.php
            config.TEMPLATE.inc.php
            classes
            controllers
            pages
            api
            plugins
            lib/pkp
            schemas
            tools
          )
          missing=0
          for path in "${required[@]}"; do
            if [ ! -e "$path" ]; then
              echo "::error::Missing required path: $path"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing required OJS path(s) missing"
            exit 1
          fi
          echo "All required OJS paths present."

      - name: Validate config template parses
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: none
          coverage: none

      - name: Lint config template
        run: php -l config.TEMPLATE.inc.php

  # ---------------------------------------------------------------------------
  # Python: autonomous-agents-framework tests
  # ---------------------------------------------------------------------------
  python-agents-tests:
    name: Python Agents Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: skz-integration/autonomous-agents-framework
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            skz-integration/autonomous-agents-framework/requirements.txt
            skz-integration/autonomous-agents-framework/requirements_simple.txt

      - name: Install lightweight test dependencies
        # Use the simple requirements set (Flask + http stack) plus pytest and
        # common stdlib-adjacent libs so unit-marked tests can run quickly in
        # CI without pulling torch / llama-cpp-python (those are validated by
        # the dedicated AI Engine Enforcement workflow).
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements_simple.txt ]; then
            pip install -r requirements_simple.txt
          fi
          pip install \
            pytest \
            pytest-asyncio \
            pytest-cov \
            pytest-xdist \
            jinja2 \
            numpy

      - name: Show pytest configuration
        run: |
          python --version
          pip list
          cat pytest.ini

      - name: Run unit tests
        # Restrict to fast unit tests; integration / slow / e2e tests run in a
        # separate job so this lane stays under ~10 minutes.
        run: |
          mkdir -p ../../artifacts
          pytest \
            -m "not slow and not integration and not e2e" \
            --maxfail=20 \
            --durations=25 \
            --junitxml=../../artifacts/python-agents-junit.xml \
            -n auto \
            --ignore=tests/integration \
            --ignore=tests/comprehensive \
            tests || EXIT=$?
          # pytest exit code 5 == "no tests collected"; treat as failure here
          # because we expect at least the smoke tests to be discoverable.
          exit ${EXIT:-0}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-agents-junit
          path: artifacts/python-agents-junit.xml
          if-no-files-found: ignore

  python-agents-integration:
    name: Python Agents Integration & E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: python-agents-tests
    defaults:
      run:
        working-directory: skz-integration/autonomous-agents-framework
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            skz-integration/autonomous-agents-framework/requirements_simple.txt

      - name: Install integration dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements_simple.txt ]; then
            pip install -r requirements_simple.txt
          fi
          pip install pytest pytest-asyncio pytest-cov jinja2 numpy

      - name: Run integration & e2e tests (best-effort)
        # Integration tests may require external services that are not
        # available in CI (Postgres, Redis, etc.). We run them in best-effort
        # mode so that infrastructure-gated tests xfail/skip cleanly while
        # still surfacing real regressions in shape or import.
        run: |
          mkdir -p ../../artifacts
          set +e
          pytest \
            -m "integration or e2e" \
            --durations=25 \
            --junitxml=../../artifacts/python-agents-integration-junit.xml \
            tests
          status=$?
          # Exit 5 == no tests collected; not an error in this lane.
          if [ $status -eq 5 ]; then
            echo "No integration/e2e tests collected."
            status=0
          fi
          exit $status

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-agents-integration-junit
          path: artifacts/python-agents-integration-junit.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Node.js: dashboards (build + lint)
  # ---------------------------------------------------------------------------
  node-dashboards:
    name: Dashboard ${{ matrix.dashboard }} (${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dashboard:
          - workflow-visualization-dashboard
          - simulation-dashboard
        node: ['18', '20']
    defaults:
      run:
        working-directory: skz-integration/${{ matrix.dashboard }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: skz-integration/${{ matrix.dashboard }}/package-lock.json

      - name: Install dependencies
        # Repo guideline: --legacy-peer-deps is required (date-fns/react-day-picker conflicts).
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Verify dist output
        run: |
          if [ ! -d dist ]; then
            echo "::error::Build did not produce a dist/ directory"
            exit 1
          fi
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::dist/ is empty after build"
            exit 1
          fi
          echo "Build artifacts:"
          ls -la dist | head -20

      - name: Upload build artifact
        if: matrix.node == '20'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dashboard }}-dist
          path: skz-integration/${{ matrix.dashboard }}/dist
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Shell scripts: shellcheck for repo automation
  # ---------------------------------------------------------------------------
  shell-scripts:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          set -euo pipefail
          # Scan repo-owned shell scripts but skip vendored / submodule paths.
          mapfile -t scripts < <(find . \
            -type f -name '*.sh' \
            -not -path './lib/pkp/*' \
            -not -path './node_modules/*' \
            -not -path './**/node_modules/*' \
            -not -path './**/vendor/*' \
            -not -path './**/venv/*' \
            -not -path './.git/*')
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found."
            exit 0
          fi
          echo "Checking ${#scripts[@]} shell script(s):"
          printf '  %s\n' "${scripts[@]}"
          # Severity 'error' so pre-existing style/warning nags don't fail the
          # build, but genuinely broken scripts (parse errors, undefined vars
          # in strict mode, etc.) still do.
          shellcheck -S error -x "${scripts[@]}"

  # ---------------------------------------------------------------------------
  # E2E smoke: validate cross-cutting repo health invariants
  # ---------------------------------------------------------------------------
  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install smoke test deps
        run: pip install pytest

      - name: Run repository smoke tests
        run: pytest tests/e2e -v --maxfail=5

      - name: Validate health-check script syntax
        run: |
          if [ -f skz-integration/scripts/health-check.sh ]; then
            bash -n skz-integration/scripts/health-check.sh
            echo "health-check.sh syntax OK"
          else
            echo "::warning::health-check.sh not found"
          fi

  # ---------------------------------------------------------------------------
  # Aggregate gate: a single required check for branch protection
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test Summary
    runs-on: ubuntu-latest
    needs:
      - php-lint
      - php-structure
      - python-agents-tests
      - python-agents-integration
      - node-dashboards
      - shell-scripts
      - e2e-smoke
    if: always()
    steps:
      - name: Aggregate result
        run: |
          set -euo pipefail
          declare -A results=(
            [php-lint]="${{ needs.php-lint.result }}"
            [php-structure]="${{ needs.php-structure.result }}"
            [python-agents-tests]="${{ needs.python-agents-tests.result }}"
            [python-agents-integration]="${{ needs.python-agents-integration.result }}"
            [node-dashboards]="${{ needs.node-dashboards.result }}"
            [shell-scripts]="${{ needs.shell-scripts.result }}"
            [e2e-smoke]="${{ needs.e2e-smoke.result }}"
          )
          fail=0
          for job in "${!results[@]}"; do
            r="${results[$job]}"
            printf '  %-28s %s\n' "$job" "$r"
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more required jobs did not succeed."
            exit 1
          fi
          echo "All required jobs succeeded."
